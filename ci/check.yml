name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:openapi:browser
      - run: npm run test:browser
      - run: npm run test:workspace
      - run: npm run test:layout
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: manualdock
          path: manualdock-v*.zip
          if-no-files-found: error
